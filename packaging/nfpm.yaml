# nfpm definition of the Bear Den TV .deb (docs/operations.md → Packaging).
# Build with `make package` (packaging/build-deb.sh), which stages
# build/package/ and exports VERSION (packaging/version.sh).
#
# Layout:
#   /usr/bin/bear-den-tv                   coordinator + CLI (static Go)
#   /opt/bear-den-tv/shell/                TV shell + bundled Qt 6.8 (bundle-qt.sh)
#   /usr/bin/bear-den-tv-shell             → the bundle's wrapper; the
#                                          coordinator finds it next to itself
#   /usr/lib/bear-den-tv/start-session.sh  (re)start with the watchdog; what
#                                          `autostart enable` and `shortcut enable` run
#   /usr/share/bear-den-tv/autostart/      a login entry to copy by hand; the
#                                          package never enables autostart itself
#
# depends: what the bundle loads from the system (bundle-qt.sh lists what it
# leaves out), checked with `ldd -r` of every bundled ELF in clean
# ubuntu:22.04 and ubuntu:24.04 containers. libc6 >= 2.28: the shell is built
# against a glibc 2.28 sysroot and build-deb.sh fails if anything shipped
# needs newer.
name: bear-den-tv
arch: amd64
platform: linux
version: ${VERSION}
version_schema: none
section: video
priority: optional
maintainer: Bear Den TV contributors
description: |
  TV home screen with a LAN phone remote for Plex HTPC and VacuumTube.
  Installs the session coordinator and CLI, and the Qt Quick TV shell with
  a bundled Qt runtime. The apps (Plex HTPC, VacuumTube, Moonlight) are
  separate Flatpaks. Nothing starts at login until you run
  `bear-den-tv autostart enable`.
license: MIT
depends:
  - libc6 (>= 2.28)
  - libgl1
  - libegl1
  - libx11-6
  - libx11-xcb1
  - libxcb1
  - libxcb-glx0
  - libxcb-randr0
  - libxcb-render0
  - libxcb-shape0
  - libxcb-shm0
  - libxcb-sync1
  - libxcb-xfixes0
  - libxcb-xkb1
  - libxkbcommon0
  - libxkbcommon-x11-0
  - libdbus-1-3
  - fontconfig-config
recommends:
  - flatpak
contents:
  - src: build/package/bear-den-tv
    dst: /usr/bin/bear-den-tv
    file_info:
      mode: 0755
  - src: build/package/shell
    dst: /opt/bear-den-tv/shell
    type: tree
  - src: /opt/bear-den-tv/shell/bin/bear-den-tv-shell
    dst: /usr/bin/bear-den-tv-shell
    type: symlink
  - src: scripts/start-session.sh
    dst: /usr/lib/bear-den-tv/start-session.sh
    file_info:
      mode: 0755
  - src: packaging/bear-den-tv.desktop
    dst: /usr/share/applications/bear-den-tv.desktop
    file_info:
      mode: 0644
  - src: packaging/autostart/bear-den-tv.desktop
    dst: /usr/share/bear-den-tv/autostart/bear-den-tv.desktop
    file_info:
      mode: 0644
  - src: packaging/icons/bear-den-tv.svg
    dst: /usr/share/icons/hicolor/scalable/apps/bear-den-tv.svg
    file_info:
      mode: 0644
  - src: docs/operations.md
    dst: /usr/share/doc/bear-den-tv/operations.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/bear-den-tv/copyright
    file_info:
      mode: 0644
