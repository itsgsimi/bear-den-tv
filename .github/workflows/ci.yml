# CI: the checks every contributor runs (CONTRIBUTING.md -> Run the checks):
# `make test` and `make lint`, plus a check that the committed phone remote build
# (apps/remote-web/dist) and navigation script (apps/web-nav/dist), both
# embedded by Go, match a fresh build.
# Toolchain: scripts/bootstrap-toolchain.sh (pinned conda-forge env via
# micromamba), cached on the files that define it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Only `make shell-target` (deploys to a TV) needs the glibc 2.28 sysroot.
      BDTV_SKIP_SYSROOT: "1"
    # No apt step: a replay in a clean ubuntu:24.04 container passed with only
    # what this runner image already has (curl, bzip2, make, git, and binutils,
    # whose `ar` CMake picks up; the Qt offscreen tests need no system fonts or GL).
    steps:
      - uses: actions/checkout@v4

      # conda envs hard-code their prefix, so the cache is restored to the same
      # default path the bootstrap script uses (~/.bdtv-toolchain).
      - name: Restore toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.bdtv-toolchain
          key: bdtv-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/environment.yml', 'scripts/bootstrap-toolchain.sh') }}

      - name: Bootstrap toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          scripts/bootstrap-toolchain.sh
          # The package download cache is not needed once the env exists; drop it to keep the cache small.
          MAMBA_ROOT_PREFIX="$HOME/.bdtv-toolchain/mamba" "$HOME/.bdtv-toolchain/bin/micromamba" clean --all --yes

      # Saved right after bootstrap (not at job end) so a failing test run still
      # leaves a warm toolchain for the next run.
      - name: Save toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.bdtv-toolchain
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/remote-web/package-lock.json', 'apps/web-nav/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # The navigation script's browser tests (make test-webnav) and the Go
      # end-to-end tests of web apps run headless Playwright Chromium on
      # local fixture pages; the Go ones skip without it, which is not a pass.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web-nav/package-lock.json') }}

      - name: Install Playwright Chromium
        run: . scripts/env.sh && make apps/web-nav/node_modules/.installed && cd apps/web-nav && npx playwright install chromium

      - name: Test and lint
        run: . scripts/env.sh && make test && make lint

      # Runs even when tests fail, so both problems are reported in one run.
      - name: Committed web builds (remote-web, web-nav) match a fresh build
        if: success() || failure()
        run: . scripts/env.sh && scripts/check-web-dist.sh
